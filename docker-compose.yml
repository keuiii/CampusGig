services:
  postgres:
    image: postgres:17-alpine
    container_name: campusgig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusgig
      POSTGRES_PASSWORD: campusgig
      POSTGRES_DB: campusgig
    ports:
      - "5432:5432"
    volumes:
      - campusgig_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgig -d campusgig"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusgig_postgres_data:
