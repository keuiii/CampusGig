[core]
scan_log=''
scan_log_serialized=''
error_log=''
outbound_request_log=''
statistics=false

[signatures]
active='phpmussel.cedb,phpmussel.db,phpmussel.fdb,phpmussel.hdb,phpmussel.htdb,phpmussel.ndb,phpmussel.udb,phpmussel_graphics.db,phpmussel_graphics_regex.db,phpmussel_ole.db,phpmussel_ole_regex.db,phpmussel_pdf.db,phpmussel_regex.db,phpmussel_regex.htdb,phpmussel_regex.ndb,clamav.cedb,clamav.db,clamav.fdb,clamav.hdb,clamav.htdb,clamav.ndb,clamav_graphics.db,clamav_graphics_regex.db,clamav_ole.db,clamav_ole_regex.db,clamav_pdf.db,clamav_pdf_regex.db,campusgig.hdb'
fail_silently=false
fail_extensions_silently=false
detect_adware=true
detect_pua_pup=true
detect_shell=true

[files]
filesize_limit='16MB'
filesize_response=true
check_archives=true
max_recursion=8
block_encrypted_archives=true
max_files_in_archives=100
block_macros=true
chameleon_from_php=true
chameleon_from_exe=true
chameleon_to_archive=true
chameleon_to_doc=true
chameleon_to_img=true
chameleon_to_pdf=true
# Binary images and documents legitimately contain control bytes. MIME and
# magic-byte validation runs before this scanner, so this text heuristic must
# remain disabled while malware signatures continue to scan the full payload.
block_control_characters=false

[virustotal]
vt_public_api_key=''

[urlscanner]
google_api_key=''
